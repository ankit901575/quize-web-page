<!DOCTYPE html>
<!-- Yeh line browser ko batati hai ki yeh HTML5 page hai -->
<html lang="en">
<head>
  <!-- Hindi/English dono sahi dikhane ke liye -->
  <meta charset="UTF-8">

  <!-- Mobile screen par page sahi size mein dikhane ke liye -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Browser tab mein dikhne wala naam -->
  <title>Ankit's Quiz Zone</title>

  <!-- Design wali file (style.css) yahan judti hai -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR: sabse upar Ankit ka naam -->
  <header class="top-bar">
    <h1 class="user-name">By Ankit</h1>
    <p class="tagline">Answer fast. Become a Leopard! 🐆</p>
  </header>

  <!-- MAIN: yeh box pehle khali hai.
       script.js isme subjects, chapters, questions aur result bharta hai -->
  <main class="container" id="app"></main>

  <!-- JavaScript file (script.js) sabse neeche judti hai,
       taaki upar ka #app box pehle ban jaye -->
  <script src="script.js"></script>

</body>
</html>
